name: Publish

# Publishes only after verify. Verify builds, packs, and qualifies all 18
# release tarballs under contents:read; publish downloads those exact artifacts
# and runs OIDC Trusted Publishing without rebuilding (C0P).
# Triggers after a Version Packages merge (commit message contains "Version Packages")
# or via manual workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Default: read-only. Publish job elevates only when needed.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Version Packages') ||
      (contains(github.event.head_commit.message, 'Merge pull request') &&
      contains(github.event.head_commit.message, 'changeset-release/main'))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify (release-train gates)
        run: |
          pnpm run linked-versions:check
          pnpm run test:all
          pnpm run fixtures:check
          pnpm run recipes:check
          pnpm run pack:smoke
          pnpm run compat:smoke

      - name: Pack and qualify release artifacts
        run: |
          node --test scripts/release-artifacts.test.mjs
          # test:all already built; pack sequentially with prepack build skipped
          export AGENT_INSPECT_SKIP_PREPACK_BUILD=1
          node scripts/release-artifacts.mjs pack --out ./release-artifacts
          node scripts/release-artifacts.mjs validate --dir ./release-artifacts --expect-sha "${GITHUB_SHA}"
          node scripts/release-artifacts.mjs qualify --dir ./release-artifacts

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@11.18.0

      - name: Download verified release artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: release-artifacts

      - name: Validate transferred inventory
        run: |
          node scripts/release-artifacts.mjs validate --dir ./release-artifacts --expect-sha "${GITHUB_SHA}"

      # Trusted Publisher on npmjs.com must still name workflow: publish.yml
      # Publishes exact verified .tgz files — does not rebuild or re-pack.
      - name: Publish verified tarballs to npm (OIDC)
        run: node scripts/release-artifacts.mjs publish --dir ./release-artifacts
        env:
          NPM_CONFIG_PROVENANCE: "true"
          AGENT_INSPECT_REQUIRE_SOURCE_SHA: ${{ github.sha }}

      - name: Push package version tags
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
