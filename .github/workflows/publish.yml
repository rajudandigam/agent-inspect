name: Publish

# Publishes only. Does not open Version Packages PRs (see version-packages.yml).
# Triggers after a Version Packages merge (commit message contains "Version Packages")
# or via manual workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # contents: write — changeset publish creates and pushes git tags / GitHub releases
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Version Packages')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@11.18.0

      - run: pnpm install --frozen-lockfile

      - name: Verify (release-train gates)
        run: |
          pnpm run linked-versions:check
          pnpm run test:all
          pnpm run fixtures:check
          pnpm run recipes:check
          pnpm run pack:smoke
          pnpm run compat:smoke

      # npm Trusted Publishing (OIDC): configure on npmjs.com for EACH of the 18 fixed-group packages.
      # Package → Settings → Trusted Publisher → GitHub Actions:
      #   owner: rajudandigam, repo: agent-inspect, workflow: publish.yml
      # See docs/community/MAINTAINER-GUIDE.md#npm-trusted-publishing
      # and docs/implementation/MAINTAINER-SETTINGS-CHECKLIST-6191.md
      #
      # Break-glass (OIDC failure / first-publish recovery only):
      #   Temporarily set repo secret NPM_TOKEN with publish access on every package,
      #   re-run this workflow, then remove the secret. Do not keep NPM_TOKEN for routine releases.
      - name: Publish to npm (OIDC)
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # Break-glass only — omit from routine path; OIDC Trusted Publishing is the default.
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
