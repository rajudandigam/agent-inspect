# PROPOSED — do not deploy without maintainer review (#536)
# Goal: keep release-train verification from holding npm OIDC / contents:write.
# Preserves: pinned actions, Trusted Publishing (OIDC), Version Packages trigger conditions.
#
# Limitations: splitting jobs reduces privilege window; it does not remove every
# supply-chain risk (compromised publish step, malicious prepack, etc.).

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Default: read-only. Publish job elevates only when needed.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Version Packages') ||
      (contains(github.event.head_commit.message, 'Merge pull request') &&
      contains(github.event.head_commit.message, 'changeset-release/main'))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify (release-train gates)
        run: |
          pnpm run linked-versions:check
          pnpm run test:all
          pnpm run fixtures:check
          pnpm run recipes:check
          pnpm run pack:smoke
          pnpm run compat:smoke

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@11.18.0

      - run: pnpm install --frozen-lockfile

      # Trusted Publisher on npmjs.com must still name workflow: publish.yml
      - name: Publish to npm (OIDC)
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          AGENT_INSPECT_SKIP_PREPUBLISH_CHECKS: "1"
