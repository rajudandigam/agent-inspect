name: Version Packages

# Opens / updates the Version Packages PR only. Never publishes to npm.
# Publish is handled by publish.yml after a Version Packages merge.

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v1
        with:
          # After Changesets bumps versions/changelogs, sync mechanical public-truth
          # surfaces so Version Packages PRs are not blocked by stale version strings.
          version: pnpm run version:packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
